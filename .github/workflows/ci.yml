name: CI

on:
  pull_request:
    types: closed
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  frontend-ci:
    name: Frontend CI + Source Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-fs-report.json
          exit-code: 0

      - name: Install Semgrep
        run: python3 -m pip install semgrep

      - name: Run Semgrep SAST scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep ci \
            --json \
            --output semgrep-report.json || true

      - name: Install OPA
        run: |
          OPA_VERSION="v1.10.1"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            -o opa "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Combine security reports
        run: |
          jq -n \
            --slurpfile trivy trivy-fs-report.json \
            --slurpfile semgrep semgrep-report.json \
            '{trivy: $trivy[0], semgrep: $semgrep[0]}' > combined-ci-security-report.json

      - name: Run OPA CI security gate
        run: |
          echo "OPA deny messages:"
          opa eval \
            --format pretty \
            --data policies/ci-security.rego \
            --input combined-ci-security-report.json \
            'data.devsecops.ci.deny'

          DENY_COUNT=$(opa eval \
            --format json \
            --data policies/ci-security.rego \
            --input combined-ci-security-report.json \
            'count(data.devsecops.ci.deny)' | jq -r '.result[0].expressions[0].value')

          echo "Deny count: $DENY_COUNT"

          if [ "$DENY_COUNT" -gt 0 ]; then
            echo "CI security gate failed."
            exit 1
          fi

      - name: Build frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-security-reports
          path: |
            trivy-fs-report.json
            semgrep-report.json
            combined-ci-security-report.json
