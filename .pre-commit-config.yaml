repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit]

      - id: check-added-large-files
        args: ["--maxkb=1024"]
        stages: [pre-commit]

      - id: check-merge-conflict
        stages: [pre-commit]

      - id: end-of-file-fixer
        stages: [pre-commit]

      - id: trailing-whitespace
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: gitleaks-full-scan
        name: Gitleaks full repo scan before push
        entry: gitleaks detect --source . --redact --verbose
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: npm-audit-high-critical
        name: npm audit high/critical before push
        entry: npm audit --audit-level=high
        language: system
        pass_filenames: false
        stages: [pre-push]
